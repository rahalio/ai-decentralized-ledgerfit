    ProvenanceRecord:
      type: object
      required: [id, ledgerId, eventType, subjectType, subjectId, recordedAt]
      properties:
        id:
          type: string
        ledgerId:
          type: string
        eventType:
          type: string
          enum:
            - eventAnchored
            - jobTriggered
            - jobCompleted
            - artefactRegistered
